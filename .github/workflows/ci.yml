name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::possible-missing-else
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --all-features
      - run: python scripts/bench.py doctor
      - run: python -m py_compile scripts/bench.py
      - run: python -m unittest scripts/test_bench.py
      - run: python -c "from pathlib import Path; Path('.bench-smoke.bin').write_bytes((b'XCA smoke benchmark\\n' * 65536))"
      - run: cargo run --release -- bench .bench-smoke.bin 1
