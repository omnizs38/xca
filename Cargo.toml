[package]
name = "xca"
version = "0.1.0"
edition = "2021"
description = "Experimental adaptive lossless compression framework"
license = "GPL-3.0-only"
repository = "https://github.com/omnizs38/xca"
keywords = ["compression", "lossless", "codec", "rust"]
categories = ["compression", "command-line-utilities"]

[lib]
name = "xca"
path = "src/lib.rs"

[[bin]]
name = "xca"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
