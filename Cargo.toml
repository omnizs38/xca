[package]
name = "xca"
version = "0.14.1"
edition = "2021"
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/xca"
description = "Embeddable adaptive lossless compression library and CLI"
license = "GPL-3.0-only"
repository = "https://github.com/omnizs38/xca"
keywords = ["compression", "lossless", "codec", "rust"]
categories = ["compression", "command-line-utilities"]
[lib]
name = "xca"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]
[[bin]]
name = "xca"
path = "src/main.rs"
[features]
default = ["c-api"]
c-api = []
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
